<script type="module">
/* Ars Machina d10 renderer.
   Geometry and camera reproduce the shipped dice exactly (fitted to DIE_FACE_DATA.geo to 2e-5):

import * as THREE from 'three';

const H = (() => { // apex height that makes the kites planar
  const f = h => { const t = new THREE.Vector3(0, h, 0), u0 = new THREE.Vector3(1, A, 0),

const TOP = new THREE.Vector3(0, H, 0), BOT = new THREE.Vector3(0, -H, 0);
/* face i: [apex, side, opposite, side]; 0-4 upper (0 front, increasing to the left), 5-9 lower (5 lower-left of front, 9 lower-right) */
const FACES = [];
for (let k = 0; k < 5; k++) FACES.push([TOP, U(k), L(k), U(k + 1)]);

const W = 1024; // face texture size
let renderer, scene, camera, die, envTex;
function setup(px) {

  renderer.setPixelRatio(1); renderer.setSize(px, px);

  const key = new THREE.DirectionalLight(0xfff4e0, 1.5); key.position.set(-4, 5, 3); scene.add(key);
  const rim = new THREE.DirectionalLight(0xbcd2ff, .6); rim.position.set(3, 4, -6); scene.add(rim);

/* studio environment: bright overhead, warm key panel upper left, cool panel upper right, near-black floor */
function studio() {

  for (let i = 0; i < pos.count; i++) { const y = pos.getY(i) / 20, t = Math.max(0, y), b = Math.max(0, -y);
    const c = new THREE.Color().setRGB(.10 + .55 * t ** .8, .10 + .54 * t ** .8, .11 + .55 * t ** .8).lerp(new THREE.Color(.012, .011, .01), Math.min(1, b * 1.6)); col.push(c.r, c.g, c.b); }

/* ------------------------------------------------ procedural helpers */

const MARGIN = .08; // canvas covers x in [-.5-m, .5+m], y in [-m, 1+m] (scaled to fit)

/* ------------------------------------------------ materials */

/* ember cracks: random branching walks; drawn on colour (dark) and on the emissive map (glow) */
function cracks(spec, fi) {

/* emblem: 24-unit SVG stroke path, centred at face (0, t) with size s (face units) */
function drawEmblem(ctx, fr, spec, t, s, style, width) {
  const [cx, cy] = c2(fr, [0, t]), px = c2(fr, [s, 0])[0] - c2(fr, [0, 0])[0];

let FONT_OK = false;

/* ------------------------------------------------ one face's maps */
function faceMaps(spec, fi, label, opt) {

  if (spec.ruleGlow) { kitePath(ex, fr, .14); ex.lineWidth = rimW; ex.strokeStyle = spec.ruleGlow; ex.stroke(); }

function buildDie(spec, labels, opt) {

/* rest pose (matches the shipped hero); extra rotation q for tumble frames */
